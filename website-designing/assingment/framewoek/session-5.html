<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Updated Utility Classes Tasks</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
          <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"
        integrity="sha384-7+zCNj/IqJ95wo16oMtfsKbZ9ccEh31eOz1HGyDuCQ6wgnyJNSYdrPa03rtR1zdB"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js"
        integrity="sha384-QJHtvGhmr9XOIpI6YVutG+2QOK9T+ZnN4kzFN1RtK3zEFEIsxhlmWl5/YESvpZ13"
        crossorigin="anonymous"></script>
    <style>
        nav {
            display: flex;
            flex-wrap: wrap;
        }
        nav ul li {
            display: inline-block;
            text-decoration: none;
        }
        nav ul li a {
            text-decoration: none;
            color: white;
            font-weight: 500;
        }
        nav ul li a:hover {
            color: #ffc107;
        }
        
       
        .movie-card {
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        .movie-img {
            height: 400px;
            object-fit: cover; 
            width: 100%;
        }
    </style>
</head>

<body class="bg-light">
    <!-- Task 1: Profile Card -->
    <div class="card m-3 p-2 bg-dark border-warning" style="max-width:320px; border-width: 2px;">
        <div class="card-body">
            <h5 class="card-title text-warning fw-bold">Level Up Meals</h5>
            <p class="card-text text-light">Fuel your daily quests with fast, fresh deliveries straight to your door.</p>
        </div>
    </div>

    <!-- Task 2: Horizontal Navigation Bar -->
    <nav class="d-flex align-items-center bg-primary p-3 shadow-sm mb-4">
        <ul class="mb-0 ps-0 w-100 d-flex justify-content-center">
            <li><a href="#" class="mx-3">Home</a></li>
            <li><a href="#" class="mx-3">Action</a></li>
            <li><a href="#" class="mx-3">Sci-Fi</a></li>
            <li><a href="#" class="mx-3">Offers</a></li>
            <li><a href="#" class="mx-3">Cart</a></li>
            <li><a href="#" class="mx-3">Account</a></li>
        </ul>
    </nav>

    <!-- Task 3: Promotional Banner -->
    <div class="d-none d-md-block bg-warning text-dark text-center p-3 mb-4 shadow-sm">
        <strong class="fs-5">Flash Sale: Book your movie tickets now and get 20% OFF!</strong>
    </div>

    <!-- Task 4: Responsive Movie Posters (Uniform Sizes) -->
    <div class="container mb-5">
        <div class="row g-4">
            
            <!-- Movie 1: Dhurandhar -->
            <div class="col-12 col-md-4">
                <div class="bg-white p-3 shadow-sm rounded movie-card border">
                    <img src="https://boxofficewala.in/wp-content/uploads/2026/02/Dhurandhar-2-poster-BoxOFFiceWala.webp" class="movie-img rounded" alt="Dhurandhar">
                    <div class="mt-auto pt-3 text-center">
                        <h4 class="fw-bold mb-1">Dhurandhar</h4>
                        <p class="text-muted small mb-2">Action / Drama</p>
                        <button class="btn btn-outline-primary btn-sm w-100">Book Tickets</button>
                    </div>
                </div>
            </div>
      
            <!-- Movie 2: Interstellar -->
            <div class="col-12 col-md-4">
                <div class="bg-white p-3 shadow-sm rounded movie-card border">
                    <img src="https://i.pinimg.com/originals/11/1c/5c/111c5c9ad99661af2d80e38948cf29d8.jpg" class="movie-img rounded" alt="Interstellar">
                    <div class="mt-auto pt-3 text-center">
                        <h4 class="fw-bold mb-1">Interstellar</h4>
                        <p class="text-muted small mb-2">Sci-Fi / Adventure</p>
                        <button class="btn btn-outline-primary btn-sm w-100">Book Tickets</button>
                    </div>
                </div>
            </div>
      
            <!-- Movie 3: Toxic -->
            <div class="col-12 col-md-4">
                <div class="bg-white p-3 shadow-sm rounded movie-card border">
                    <img src="https://juksun.com/wp-content/uploads/2023/12/Toxic-Movie-Poster.jpg" class="movie-img rounded" alt="Toxic">
                    <div class="mt-auto pt-3 text-center">
                        <h4 class="fw-bold mb-1">Toxic</h4>
                        <p class="text-muted small mb-2">Action / Thriller</p>
                        <button class="btn btn-outline-primary btn-sm w-100">Book Tickets</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

  
</body>
</html>
