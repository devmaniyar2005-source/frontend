<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navbar & Carousel</title>
 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
<!-- icons CDN -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<!-- custom css -->
<link rel="stylesheet" href="css/style.css">
<!-- js CDN -->
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js" integrity="sha384-7+zCNj/IqJ95wo16oMtfsKbZ9ccEh31eOz1HGyDuCQ6wgnyJNSYdrPa03rtR1zdB" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js" integrity="sha384-QJHtvGhmr9XOIpI6YVutG+2QOK9T+ZnN4kzFN1RtK3zEFEIsxhlmWl5/YESvpZ13" crossorigin="anonymous"></script>
  <style>
    .carousel-item img {
      height: 400px;
      object-fit: cover;
    }
  </style>
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm py-3">
    <div class="container">
      <a class="navbar-brand text-danger fw-bold fs-3" href="#">FoodieLogo</a>
      
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNavbar">
        <form class="d-none d-lg-flex mx-auto w-50">
          <input class="form-control rounded-pill px-4" type="search" placeholder="Search for restaurants, cuisines, or dishes...">
        </form>
        
        <ul class="navbar-nav ms-auto gap-3 text-center mt-3 mt-lg-0">
          <li class="nav-item"><a class="nav-link text-dark fs-5" href="#">Home</a></li>
          <li class="nav-item"><a class="nav-link text-dark fs-5" href="#">Restaurants</a></li>
          <li class="nav-item"><a class="nav-link text-dark fs-5" href="#">Orders</a></li>
          <li class="nav-item"><a class="nav-link text-dark fs-5" href="#">Profile</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-5">
    <div id="musicPromoCarousel" class="carousel slide" data-bs-ride="carousel">
      
      <div class="carousel-indicators">
        <button type="button" data-bs-target="#musicPromoCarousel" data-bs-slide-to="0" class="active"></button>
        <button type="button" data-bs-target="#musicPromoCarousel" data-bs-slide-to="1"></button>
        <button type="button" data-bs-target="#musicPromoCarousel" data-bs-slide-to="2"></button>
      </div>
      
      <div class="carousel-inner rounded-4 shadow">
        <div class="carousel-item active">
          <img src="https://picsum.photos/1200/400?1" class="d-block w-100" alt="Promotion 1">
        </div>
        <div class="carousel-item">
          <img src="https://picsum.photos/1200/400?2" class="d-block w-100" alt="Promotion 2">
        </div>
        <div class="carousel-item">
          <img src="https://picsum.photos/1200/400?3" class="d-block w-100" alt="Promotion 3">
        </div>
      </div>
      
      <button class="carousel-control-prev" type="button" data-bs-target="#musicPromoCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#musicPromoCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
      </button>
    </div>
  </div>

 
</body>
</html>
