<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Session 4 - Display & Layout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="task1-container">
    <div class="box-block">Home</div>
    <div class="box-inline">Explore</div>
    <div class="box-inline-block">Profile</div>
  </div>

  <nav class="ig-navbar">
    <div class="nav-item">Instagram</div>
    <div class="nav-item">Search bar</div>
    <div class="nav-item">Icons</div>
  </nav>

  <div class="flipkart-layout clearfix">
    <div class="product-list">
      <h2>Products</h2>
      <div class="item">Laptop - ₹50,000</div>
      <div class="item">Smartphone - ₹15,000</div>
      <div class="item">Headphones - ₹2,000</div>
      <div class="item">Smartwatch - ₹3,500</div>
    </div>
    
    <div class="sidebar-cart">
      <h2>Your Cart</h2>
      <div class="item">1x Laptop</div>
      <div class="item">Total: ₹50,000</div>
      <button>Checkout</button>
    </div>
  </div>

</body>
</html>
