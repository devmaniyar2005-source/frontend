<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Box Model & Positioning Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="sticky-navbar">
    <div class="logo">MiniTube</div>
    <ul class="nav-links">
      <li>Home</li>
      <li>Shorts</li>
      <li>Subscriptions</li>
    </ul>
  </nav>

  <main class="content-wrapper">
    
    <section class="ig-stories-container">
      <div class="story-circle"><img src="https://picsum.photos/100?1" alt="User 1"></div>
      <div class="story-circle"><img src="https://picsum.photos/100?2" alt="User 2"></div>
      <div class="story-circle"><img src="https://picsum.photos/100?3" alt="User 3"></div>
      <div class="story-circle"><img src="https://picsum.photos/100?4" alt="User 4"></div>
      <div class="story-circle"><img src="https://picsum.photos/100?5" alt="User 5"></div>
    </section>

    <section class="products-section">
      <h2>Top Deals</h2>
      <div class="products-flex">
        <div class="product-card">
          <img src="https://picsum.photos/150?10" alt="Phone">
          <h3>Smartphone X</h3>
          <p>₹15,999</p>
        </div>
        <div class="product-card">
          <img src="https://picsum.photos/150?11" alt="Headphones">
          <h3>Wireless Headphones</h3>
          <p>₹2,499</p>
        </div>
      </div>
    </section>

    <section class="video-feed">
      <h2>Recommended Videos</h2>
      <div class="video-thumbnail">Video 1</div>
      <div class="video-thumbnail">Video 2</div>
      <div class="video-thumbnail">Video 3</div>
      <div class="video-thumbnail">Video 4</div>
      <div class="video-thumbnail">Video 5</div>
      <div class="video-thumbnail">Video 6</div>
    </section>

  </main>

  <button class="floating-order-btn">Order Now</button>

</body>
</html>
