<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Cards</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    
    <div class="card spotify-card">
      <img src="https://picsum.photos/150/150?1" alt="Artist" class="spotify-img">
      <h3>Artist Name</h3>
      <p>Monthly Listeners: 1.2M</p>
    </div>

    <div class="card flipkart-card">
      <img src="https://picsum.photos/150/150?2" alt="Product">
      <h3>Smartphone X</h3>
      <p>₹15,999</p>
      <button>Add to Cart</button>
    </div>

    <div class="card bms-card">
      <h2 class="movie-title">INCEPTION</h2>
    </div>

    <div class="card zomato-card">
      <div class="overlay">
        <h3>The Grand Kitchen</h3>
        <p>North Indian, Chinese</p>
      </div>
    </div>

    <div class="card ipl-card">
      <h2 class="player-name">MS DHONI</h2>
      <p class="team">Chennai Super Kings</p>
    </div>

  </div>
</body>
</html>
