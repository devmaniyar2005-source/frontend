<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Session 9 - Animations & Media Queries</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

  <nav class="navbar">
    <div class="logo">SiteLogo</div>
    <div class="hamburger">☰</div>
    <ul class="nav-links">
      <li>Home</li>
      <li>About</li>
      <li>Contact</li>
    </ul>
  </nav>

  <div class="container">
    <button class="bms-btn">Book Now</button>

    <div class="flipkart-card">
      <img src="https://picsum.photos/200" alt="Product">
      <h3>Wireless Headphones</h3>
      <p>₹1,999</p>
    </div>

    <div class="zomato-grid">
      <div class="zomato-item">Spicy Kitchen</div>
      <div class="zomato-item">Burger Point</div>
      <div class="zomato-item">Sushi Bar</div>
      <div class="zomato-item">Pizza Haven</div>
    </div>
  </div>

  <script>
    gsap.from(".flipkart-card", {
      duration: 1.2,
      y: 50,
      opacity: 0,
      ease: "power2.out",
      delay: 0.2
    });
  </script>

</body>
</html>
