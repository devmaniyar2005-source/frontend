<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickEats - Task 3 Checkout Form</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
     <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

  <!-- Centering wrapper for presentation -->
  <div class="container d-flex justify-content-center mt-5 mb-5">
    
    <!-- Form Container styled with utility classes as instructed -->
    <div class="w-100 mt-4 p-4 rounded shadow-sm bg-light" style="max-width: 600px;">
      <h3 class="mb-4 fw-bold">Delivery Details</h3>
      
      <form novalidate>
        
        <!-- Full Name (Valid State) -->
        <div class="form-floating mb-3">
          <input type="text" class="form-control is-valid" id="floatingName" placeholder="Full Name" value="Dev maniyar" required>
          <label for="floatingName">Full Name</label>
          <div class="valid-feedback">
            Looks good!
          </div>
        </div>

        <!-- Mobile Number (Invalid State) -->
        <div class="form-floating mb-3">
          <input type="tel" class="form-control is-invalid" id="floatingMobile" placeholder="Mobile Number" required>
          <label for="floatingMobile">Mobile Number</label>
          <div class="invalid-feedback">
            Please enter a valid 10-digit mobile number.
          </div>
        </div>

        <!-- Delivery Address Textarea (Invalid State) -->
        <div class="form-floating mb-3">
          <textarea class="form-control is-invalid" placeholder="Delivery Address" id="floatingAddress" style="height: 100px" required></textarea>
          <label for="floatingAddress">Delivery Address</label>
          <div class="invalid-feedback">
            Please provide a complete delivery address.
          </div>
        </div>

        <!-- Delivery Time Slot Select (Valid State) -->
        <div class="form-floating mb-4">
          <select class="form-select is-valid" id="floatingTimeSlot" aria-label="Delivery Time Slot dropdown" required>
            <option disabled>Select a delivery time</option>
            <option value="now" selected>Now</option>
            <option value="30min">Within 30 min</option>
            <option value="12to1">12:00–1:00 PM</option>
            <option value="1to2">1:00–2:00 PM</option>
          </select>
          <label for="floatingTimeSlot">Delivery Time Slot</label>
          <div class="valid-feedback">
            Perfect timing!
          </div>
        </div>

        <!-- Submit Button -->
        <button class="btn btn-success w-100 py-3 fw-bold" type="submit">Place Order</button>
        
      </form>
    </div>
  </div>

 
</body>
</html>
