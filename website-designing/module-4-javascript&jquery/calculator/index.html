<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Functional Tailwind Calculator | Dev Maniyar</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-50 font-['Inter'] min-h-screen flex items-center justify-center p-4">

    <!-- Calculator Wrapper -->
    <div class="bg-slate-800 p-6 sm:p-8 rounded-3xl shadow-2xl w-full max-w-sm border border-slate-700">
        
        <!-- Header -->
        <div class="text-center mb-6">
            <h4 class="text-xl font-bold text-violet-400 mb-1">UI Calculator</h4>
            <p class="text-slate-400 text-sm">Dev Maniyar</p>
        </div>

        <!-- Calculator Display -->
        <div class="bg-slate-900 border-2 border-slate-700 focus-within:border-cyan-400 focus-within:shadow-[0_0_15px_rgba(34,211,238,0.2)] transition-all rounded-2xl p-4 mb-6 shadow-inner flex flex-col justify-end">
            <!-- History Display -->
            <p id="history" class="text-slate-400 text-sm text-right h-5 mb-1 px-1"></p>
            
            <!-- Main Input Field -->
            <input 
                type="text" 
                id="display"
                placeholder="0"
                class="w-full bg-transparent text-cyan-400 text-4xl font-bold text-right outline-none tracking-wider placeholder-slate-600"
                dir="rtl"
                readonly
            >
        </div>

        <!-- Calculator Keypad (CSS Grid) -->
        <div class="grid grid-cols-4 gap-3 sm:gap-4">
            
            <!-- Row 1 -->
            <button onclick="clearDisplay()" class="col-span-1 bg-rose-500 hover:bg-rose-600 active:bg-rose-700 text-white p-4 rounded-xl text-lg font-bold transition-transform hover:-translate-y-1 shadow-md">AC</button>
            <button onclick="deleteLast()" class="col-span-1 bg-orange-500 hover:bg-orange-600 active:bg-orange-700 text-white p-4 rounded-xl text-lg font-bold transition-transform hover:-translate-y-1 shadow-md flex items-center justify-center gap-1">
                <span class="text-sm">⌫</span>
            </button>
            <button onclick="appendValue('/')" class="col-span-1 bg-blue-500 hover:bg-blue-600 active:bg-blue-700 text-white p-4 rounded-xl text-xl font-bold transition-transform hover:-translate-y-1 shadow-md">÷</button>
            <button onclick="appendValue('*')" class="col-span-1 bg-blue-500 hover:bg-blue-600 active:bg-blue-700 text-white p-4 rounded-xl text-xl font-bold transition-transform hover:-translate-y-1 shadow-md">×</button>

            <!-- Row 2 -->
            <button onclick="appendValue('7')" class="col-span-1 bg-slate-700 hover:bg-slate-600 active:bg-slate-500 text-slate-100 p-4 rounded-xl text-xl font-bold transition-transform hover:-translate-y-1 shadow-md">7</button>
            <button onclick="appendValue('8')" class="col-span-1 bg-slate-700 hover:bg-slate-600 active:bg-slate-500 text-slate-100 p-4 rounded-xl text-xl font-bold transition-transform hover:-translate-y-1 shadow-md">8</button>
            <button onclick="appendValue('9')" class="col-span-1 bg-slate-700 hover:bg-slate-600 active:bg-slate-500 text-slate-100 p-4 rounded-xl text-xl font-bold transition-transform hover:-translate-y-1 shadow-md">9</button>
            <button onclick="appendValue('-')" class="col-span-1 bg-blue-500 hover:bg-blue-600 active:bg-blue-700 text-white p-4 rounded-xl text-xl font-bold transition-transform hover:-translate-y-1 shadow-md">−</button>

            <!-- Row 3 -->
            <button onclick="appendValue('4')" class="col-span-1 bg-slate-700 hover:bg-slate-600 active:bg-slate-500 text-slate-100 p-4 rounded-xl text-xl font-bold transition-transform hover:-translate-y-1 shadow-md">4</button>
            <button onclick="appendValue('5')" class="col-span-1 bg-slate-700 hover:bg-slate-600 active:bg-slate-500 text-slate-100 p-4 rounded-xl text-xl font-bold transition-transform hover:-translate-y-1 shadow-md">5</button>
            <button onclick="appendValue('6')" class="col-span-1 bg-slate-700 hover:bg-slate-600 active:bg-slate-500 text-slate-100 p-4 rounded-xl text-xl font-bold transition-transform hover:-translate-y-1 shadow-md">6</button>
            <button onclick="appendValue('+')" class="col-span-1 bg-blue-500 hover:bg-blue-600 active:bg-blue-700 text-white p-4 rounded-xl text-xl font-bold transition-transform hover:-translate-y-1 shadow-md">+</button>

            <!-- Row 4 -->
            <button onclick="appendValue('1')" class="col-span-1 bg-slate-700 hover:bg-slate-600 active:bg-slate-500 text-slate-100 p-4 rounded-xl text-xl font-bold transition-transform hover:-translate-y-1 shadow-md">1</button>
            <button onclick="appendValue('2')" class="col-span-1 bg-slate-700 hover:bg-slate-600 active:bg-slate-500 text-slate-100 p-4 rounded-xl text-xl font-bold transition-transform hover:-translate-y-1 shadow-md">2</button>
            <button onclick="appendValue('3')" class="col-span-1 bg-slate-700 hover:bg-slate-600 active:bg-slate-500 text-slate-100 p-4 rounded-xl text-xl font-bold transition-transform hover:-translate-y-1 shadow-md">3</button>
            <button onclick="appendValue('%')" class="col-span-1 bg-blue-500 hover:bg-blue-600 active:bg-blue-700 text-white p-4 rounded-xl text-xl font-bold transition-transform hover:-translate-y-1 shadow-md">%</button>

            <!-- Row 5 -->
            <button onclick="appendValue('0')" class="col-span-1 bg-slate-700 hover:bg-slate-600 active:bg-slate-500 text-slate-100 p-4 rounded-xl text-xl font-bold transition-transform hover:-translate-y-1 shadow-md">0</button>
            <button onclick="appendValue('.')" class="col-span-1 bg-slate-700 hover:bg-slate-600 active:bg-slate-500 text-slate-100 p-4 rounded-xl text-xl font-bold transition-transform hover:-translate-y-1 shadow-md">.</button>
            
            <!-- Equals Button -->
            <button onclick="calculate()" class="col-span-2 bg-emerald-500 hover:bg-emerald-600 active:bg-emerald-700 text-white p-4 rounded-xl text-2xl font-bold transition-transform hover:-translate-y-1 shadow-md">=</button>
            
        </div>
    </div>

    <!-- Link to the external JavaScript file -->
    <script src="calculator.js"></script>
</body>
</html>
